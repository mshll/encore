services:
  encore:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    # Every app variable is passed through; an empty value means the app default (see README).
    environment:
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:?SPOTIFY_CLIENT_ID is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      TIMEZONE: ${TIMEZONE:-}
      HOME_COUNTRY: ${HOME_COUNTRY:-}
      JOBS_ENABLED: ${JOBS_ENABLED:-}
      JOBS_DISABLED: ${JOBS_DISABLED:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-}
      ENRICH_INTERVAL_SECONDS: ${ENRICH_INTERVAL_SECONDS:-}
      ENRICH_BATCH_SIZE: ${ENRICH_BATCH_SIZE:-}
      ART_INTERVAL_SECONDS: ${ART_INTERVAL_SECONDS:-}
      SPOTIFY_MIN_INTERVAL_MS: ${SPOTIFY_MIN_INTERVAL_MS:-}
      QUOTA_BACKOFF_HOURS: ${QUOTA_BACKOFF_HOURS:-}
      WATCHER_ACTIVE_SECONDS: ${WATCHER_ACTIVE_SECONDS:-}
      WATCHER_IDLE_SECONDS: ${WATCHER_IDLE_SECONDS:-}
      WATCHER_BACKOFF_MAX_SECONDS: ${WATCHER_BACKOFF_MAX_SECONDS:-}
      DJ_SKIP_TRIGGER: ${DJ_SKIP_TRIGGER:-}
      DJ_REPLANNER: ${DJ_REPLANNER:-}
      DJ_REPLAN_TIMEOUT_SECONDS: ${DJ_REPLAN_TIMEOUT_SECONDS:-}
      RADAR_MIN_LISTENS: ${RADAR_MIN_LISTENS:-}
      RADAR_INTERVAL_MINUTES: ${RADAR_INTERVAL_MINUTES:-}
      RADAR_ARTISTS_PER_RUN: ${RADAR_ARTISTS_PER_RUN:-}
      RADAR_RECHECK_DAYS: ${RADAR_RECHECK_DAYS:-}
      RADAR_BASELINE_DAYS: ${RADAR_BASELINE_DAYS:-}
      LIBRARY_SYNC_HOURS: ${LIBRARY_SYNC_HOURS:-}
      LIBRARY_PAGE_SECONDS: ${LIBRARY_PAGE_SECONDS:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      DISCORD_OWNER_ID: ${DISCORD_OWNER_ID:-}
      MCP_TOKEN: ${MCP_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PRICES: ${LLM_PRICES:-}
      MONTHLY_BUDGET_USD: ${MONTHLY_BUDGET_USD:-}
      PICKS_PER_WEEK: ${PICKS_PER_WEEK:-}
      PICKS_FAR_OUT: ${PICKS_FAR_OUT:-}
      PICKS_WEEKDAY: ${PICKS_WEEKDAY:-}
      PICKS_HOUR: ${PICKS_HOUR:-}
      PICKS_PLAYLIST: ${PICKS_PLAYLIST:-}
      DIGEST_WEEKDAY: ${DIGEST_WEEKDAY:-}
      DIGEST_HOUR: ${DIGEST_HOUR:-}
    volumes:
      - encore-data:/data

volumes:
  encore-data:
